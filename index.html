<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vitae · Resume Builder</title>
  <meta name="description" content="Vitae is a premium, private resume builder. Live preview, ATS-friendly templates, PDF export and job description matching. Works offline.">
  <meta name="author" content="direk james">
  <meta name="theme-color" content="#f5f4f1">
  <meta property="og:title" content="Vitae · Resume Builder">
  <meta property="og:description" content="Build a polished resume in minutes. Private, offline and free.">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vitae">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Geist:wght@400..700&family=Inter:wght@400..700&family=Manrope:wght@400..800&family=Outfit:wght@400..700&family=Plus+Jakarta+Sans:wght@400..800&family=Sora:wght@400..700&family=Space+Grotesk:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/resume.css">
  <style id="page-size">@page { size: A4; margin: 0; }</style>
</head>
<body>
  <div class="app" id="app" data-view="edit">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Vitae home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0c0d10"/><path d="M9.2 9.5h3.3l3.5 10.2 3.5-10.2h3.3L17.6 23h-3.2z" fill="#fff"/><circle cx="23.6" cy="22.2" r="1.7" fill="#c8a36a"/></svg>
        <span class="brand-word">Vitae</span>
      </a>

      <div class="versions">
        <button class="version-btn" id="version-btn" data-act="version-menu" aria-haspopup="true" aria-expanded="false">
          <span class="version-label"><span id="version-name">Resume</span><small id="version-count"></small></span>
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
        </button>
        <div class="popover vmenu" id="version-menu" hidden></div>
      </div>

      <div class="top-actions">
        <span class="save-state" id="save-state" aria-live="polite"></span>
        <button class="btn ghost hide-sm" id="install-btn" data-act="install" hidden title="Install Vitae as an app">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M5 21h14"/></svg><span>Install</span>
        </button>
        <button class="btn ghost icon-sm" data-act="guide" title="How to use Vitae">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.2a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.6-2.8 2.6M12 17h.01"/></svg><span>Guide</span>
        </button>
        <button class="btn ghost icon-sm" data-act="import" title="Import a backup (.json)">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V5m0 0L7.5 9.5M12 5l4.5 4.5M5 21h14"/></svg><span>Import</span>
        </button>
        <button class="btn ghost icon-sm" data-act="export" title="Export all versions as a backup (.json)">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg><span>Backup</span>
        </button>
        <button class="btn ghost icon-sm" data-act="publish" title="Publish as a web page">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5a14.5 14.5 0 0 1 0 19M12 2.5a14.5 14.5 0 0 0 0 19"/></svg><span>Publish</span>
        </button>
        <button class="btn primary" data-act="pdf" title="Download PDF (Ctrl+P)">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M5 21h14"/></svg><span>Download PDF</span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel" aria-label="Editor">
        <nav class="tabs" role="tablist">
          <button class="tab on" data-tab="content" role="tab">
            <svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8zM14 2.5V8h5.5M15.5 13h-7M15.5 17h-7"/></svg>Content
          </button>
          <button class="tab" data-tab="design" role="tab">
            <svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5a9.5 9.5 0 1 1 9.5-9.5c0 2.5-2 3.5-4 3.5h-2a2 2 0 0 0-1.4 3.4c.6.6.5 2.6-2.1 2.6z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg>Design
          </button>
          <button class="tab" data-tab="match" role="tab">
            <svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.5"/></svg>Job match
          </button>
        </nav>
        <div class="panel-body" id="panel-body"></div>
      </section>

      <section class="stage" aria-label="Preview">
        <div class="stage-bar">
          <div class="fit-pill" id="fit-pill"></div>
          <span class="stage-meta" id="stage-meta"></span>
        </div>
        <div class="stage-scroll" id="stage-scroll">
          <div class="paper-frame" id="paper-frame">
            <div class="paper-scale" id="paper-scale">
              <div id="preview"></div>
              <div class="breaks" id="breaks"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="mobile-switch" role="tablist">
      <button class="on" data-act="view-edit">Edit</button>
      <button data-act="view-preview">Preview</button>
    </div>
  </div>

  <div id="print-root" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="import-input" accept="application/json,.json" hidden>
  <input type="file" id="photo-input" accept="image/*" hidden>

  <noscript><p style="padding:24px;font-family:system-ui">Vitae needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
